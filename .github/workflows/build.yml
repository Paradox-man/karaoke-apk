name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang kebutuhan build
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev build-essential
          pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv

      - name: Build APK
        run: buildozer -v android debug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-apk
          path: bin/*.apk
